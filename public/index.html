<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MTG Card Forge</title>
  <style>
    body {
      background: #11141a;
      color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      margin: 0;
    }
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 2rem;
      width: 100%;
      max-width: 600px;
    }
    input {
      flex: 1;
      padding: 10px 14px;
      background: #1c212d;
      border: 1px solid #3b4252;
      color: #fff;
      border-radius: 6px;
    }
    button {
      padding: 10px 20px;
      background: #d08770;
      color: #111;
      border: none;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; }

    /* MTG Card Frame */
    .card-frame {
      display: none;
      width: 360px;
      background: #171314;
      border: 12px solid #080708;
      border-radius: 18px;
      padding: 12px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.8);
      box-sizing: border-box;
    }
    .header-bar, .type-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #2b2826;
      border: 1px solid #57504b;
      padding: 6px 10px;
      border-radius: 6px;
      font-family: Georgia, serif;
      font-weight: bold;
      color: #f7f4ea;
    }
    .art-frame {
      width: 100%;
      height: 230px;
      margin: 8px 0;
      border-radius: 4px;
      overflow: hidden;
      background: #000;
      border: 2px solid #332f2c;
    }
    .art-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .text-box {
      background: #cfc2af;
      color: #1c1815;
      font-family: Georgia, serif;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.88rem;
      min-height: 100px;
      margin-top: 8px;
      line-height: 1.35;
    }
    .flavor-text {
      margin-top: 8px;
      border-top: 1px solid #999;
      padding-top: 6px;
      font-style: italic;
      color: #3b3734;
    }
    .pt-box {
      text-align: right;
      font-weight: bold;
      font-family: Georgia, serif;
      font-size: 1.15rem;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <h1>⚔️ MTG AI Card Forge</h1>
  <div class="controls">
    <input id="promptInput" placeholder="e.g. A neon-lit cybernetic hydra that absorbs electrical spells" />
    <button id="genBtn" onclick="forgeCard()">Forge Card</button>
  </div>

  <div id="loading" style="display:none; color: #ebcb8b;">Forging card mechanics with Gemini & painting art with Imagen...</div>

  <div id="cardFrame" class="card-frame">
    <div class="header-bar">
      <span id="cardName">Card Name</span>
      <span id="manaCost">{2}{U}</span>
    </div>
    <div class="art-frame">
      <img id="cardImage" src="" alt="Art" />
    </div>
    <div class="type-bar">
      <span id="typeLine">Creature</span>
      <span id="rarity">Mythic</span>
    </div>
    <div class="text-box">
      <div id="oracleText">Rules text goes here.</div>
      <div id="flavorText" class="flavor-text">Flavor text goes here.</div>
    </div>
    <div id="ptBox" class="pt-box"></div>
  </div>

  <script>
    async function forgeCard() {
      const prompt = document.getElementById('promptInput').value.trim();
      if (!prompt) return;

      const btn = document.getElementById('genBtn');
      const loader = document.getElementById('loading');
      const card = document.getElementById('cardFrame');

      btn.disabled = true;
      loader.style.display = 'block';
      card.style.display = 'none';

      try {
        const res = await fetch('/api/generate-card', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        document.getElementById('cardName').textContent = data.card.name;
        document.getElementById('manaCost').textContent = data.card.manaCost;
        document.getElementById('typeLine').textContent = data.card.typeLine;
        document.getElementById('rarity').textContent = data.card.rarity;
        document.getElementById('oracleText').innerText = data.card.oracleText;
        document.getElementById('flavorText').innerText = `"${data.card.flavorText}"`;
        document.getElementById('cardImage').src = data.imageBase64;

        const ptBox = document.getElementById('ptBox');
        if (data.card.power && data.card.toughness) {
          ptBox.textContent = `${data.card.power}/${data.card.toughness}`;
          ptBox.style.display = 'block';
        } else {
          ptBox.style.display = 'none';
        }

        card.style.display = 'block';
      } catch (err) {
        alert('Failed: ' + err.message);
      } finally {
        btn.disabled = false;
        loader.style.display = 'none';
      }
    }
  </script>
</body>
</html>
